<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工业窑炉烘炉曲线核验台</title><link rel="stylesheet" href="/static/app.css"></head><body><main><header><h1>工业窑炉烘炉曲线核验台</h1><p>批次、升温曲线与放行证据一站式核验</p></header><section class="toolbar"><button id="refresh">刷新批次</button><button id="new">新建批次</button><span id="notice"></span></section><section id="create" class="panel hidden"><h2>创建烘炉批次</h2><form id="createForm"><input name="name" placeholder="批次名称" required><input name="kilnCode" placeholder="炉号" required><input name="liningMaterial" placeholder="炉衬材质" required><input name="operator" placeholder="操作员" required><input name="engineer" placeholder="工程师" required><button>创建</button></form></section><section><h2>批次列表</h2><div id="batches"></div></section><section id="detail" class="panel hidden"><h2 id="detailTitle"></h2><div id="detailBody"></div><div class="forms"><form id="stageForm"><h3>配置阶段</h3><textarea name="stages" rows="5">[{"sequence":1,"targetCelsius":120,"maxRampCelsiusPerHour":30,"holdMinutes":30,"toleranceCelsius":5,"sensorIDs":["S1"]}]</textarea><button>保存阶段</button></form><form id="readingForm"><h3>录入温度</h3><textarea name="readings" rows="5" placeholder='[{"stageID":"stage-id","sensorID":"S1","recordedAt":"2026-01-01T00:00:00Z","celsius":20,"unit":"C"}]'></textarea><button>导入读数</button></form><form id="actionForm"><h3>偏差处置</h3><input name="stageID" placeholder="阶段 ID" required><input name="kind" placeholder="暂停/降温/设备检查" required><input name="reason" placeholder="原因" required><input name="actionText" placeholder="处置措施" required><input name="performedBy" placeholder="责任人" required><label><input type="checkbox" name="retestRequired">需要重测</label><button>记录整改</button></form><form id="reviewForm"><h3>质量审核</h3><input name="reviewer" placeholder="审核人" required><select name="decision"><option value="approved">批准</option><option value="rejected">退回</option></select><input name="comment" placeholder="审核意见" required><button>提交审核</button></form></div></section></main><script src="/static/app.js"></script></body></html>
